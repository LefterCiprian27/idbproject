<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drawing Board Project</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Drawing Board Project</h1>
    </header>

    <main>
        <div class="container">
            <aside class="toolbar">
                <div class="tool-section">
                    <h3>Drawing Tools</h3>
                    
                    <div class="tool-group">
                        <label for="color-picker">Color</label>
                        <div class="color-input-wrapper">
                            <input type="color" id="color-picker" value="#000000">
                            <span class="color-value">#000000</span>
                        </div>
                    </div>

                    <div class="tool-group">
                        <label for="brush-size">Brush Size: <span id="brush-size-value">5</span>px</label>
                        <input type="range" id="brush-size" min="1" max="50" value="5">
                    </div>

                    <div class="tool-group">
                        <label>Tool Mode</label>
                        <div class="button-group">
                            <button class="tool-btn active" data-tool="brush">
                                <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                                    <path d="M15.707 2.293a1 1 0 0 0-1.414 0L4 12.586V16h3.414l10.293-10.293a1 1 0 0 0 0-1.414l-2-2z"/>
                                </svg>
                                Brush
                            </button>
                            <button class="tool-btn" data-tool="eraser">
                                <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                                    <path d="M12 2l4 4-8 8-4-4 8-8zm-1.5 9.5L14 8l2 2-3.5 3.5-2-2z"/>
                                </svg>
                                Eraser
                            </button>
                        </div>
                    </div>
                </div>

                <div class="tool-section">
                    <h3>Shapes</h3>
                    <div class="button-group shapes-grid">
                        <button class="tool-btn" data-shape="line">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="2" y1="18" x2="18" y2="2"/>
                            </svg>
                            Line
                        </button>
                        <button class="tool-btn" data-shape="rectangle">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="3" width="14" height="14"/>
                            </svg>
                            Rectangle
                        </button>
                        <button class="tool-btn" data-shape="circle">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="10" cy="10" r="7"/>
                            </svg>
                            Circle
                        </button>
                        <button class="tool-btn" data-shape="triangle">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M10 3 L17 17 L3 17 Z"/>
                            </svg>
                            Triangle
                        </button>
                        <button class="tool-btn" data-shape="square">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="4" y="4" width="12" height="12"/>
                            </svg>
                            Square
                        </button>
                        <button class="tool-btn" data-shape="pentagon">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M10 2 L18 8 L15 18 L5 18 L2 8 Z"/>
                            </svg>
                            Pentagon
                        </button>
                        <button class="tool-btn" data-shape="hexagon">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M10 2 L17 6 L17 14 L10 18 L3 14 L3 6 Z"/>
                            </svg>
                            Hexagon
                        </button>
                        <button class="tool-btn" data-shape="star">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M10 2 L12 8 L18 8 L13 12 L15 18 L10 14 L5 18 L7 12 L2 8 L8 8 Z"/>
                            </svg>
                            Star
                        </button>
                    </div>
                </div>

                <div class="tool-section">
                    <h3>Actions</h3>
                    <div class="button-group">
                        <button class="action-btn" id="undo-btn" disabled>
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                                <path d="M3 10h12M7 6l-4 4 4 4"/>
                            </svg>
                            Undo
                        </button>
                        <button class="action-btn" id="redo-btn" disabled>
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                                <path d="M17 10H5M13 6l4 4-4 4"/>
                            </svg>
                            Redo
                        </button>
                        <button class="action-btn danger" id="clear-btn">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                                <path d="M6 8v10h8V8H6zm3-6v2h2V2H9zM4 6h12v1H4V6z"/>
                            </svg>
                            Clear Canvas
                        </button>
                        <button class="action-btn success" id="download-btn">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                                <path d="M10 2v12m0 0l-4-4m4 4l4-4M4 16h12v2H4v-2z"/>
                            </svg>
                            Download JPG
                        </button>
                    </div>
                </div>
            </aside>

            <section class="canvas-section">
                <div class="canvas-wrapper">
                    <canvas id="drawing-canvas"></canvas>
                </div>
            </section>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Drawing Board Project | Created for Multimedia Project, Author: Ciprian</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
