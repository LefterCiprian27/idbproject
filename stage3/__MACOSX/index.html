<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drawing Board Project</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Drawing Board Project</h1>
    </header>

    <main>
        <div class="container">
            <aside class="toolbar">
                <div class="tool-section">
                    <h3>Drawing Tools</h3>
                    
                    <div class="tool-group">
                        <label for="color-picker">Color</label>
                        <div class="color-input-wrapper">
                            <input type="color" id="color-picker" value="#000000">
                            <span class="color-value">#000000</span>
                        </div>
                    </div>

                    <div class="tool-group">
                        <label for="brush-size">Brush Size: <span id="brush-size-value">5</span>px</label>
                        <input type="range" id="brush-size" min="1" max="50" value="5">
                    </div>

                    <div class="tool-group">
                        <label>Tool Mode</label>
                        <div class="button-group">
                            <button class="tool-btn active" data-tool="brush">
                                <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                                    <path d="M15.707 2.293a1 1 0 0 0-1.414 0L4 12.586V16h3.414l10.293-10.293a1 1 0 0 0 0-1.414l-2-2z"/>
                                </svg>
                                Brush
                            </button>
                            <button class="tool-btn" data-tool="eraser">
                                <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                                    <path d="M12 2l4 4-8 8-4-4 8-8zm-1.5 9.5L14 8l2 2-3.5 3.5-2-2z"/>
                                </svg>
                                Eraser
                            </button>
                        </div>
                    </div>
                </div>

                <div class="tool-section">
                    <h3>Shapes</h3>
                    <div class="button-group shapes-grid">
                        <button class="tool-btn" data-shape="line">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="2" y1="18" x2="18" y2="2"/>
                            </svg>
                            Line
                        </button>
                        <button class="tool-btn" data-shape="rectangle">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="3" width="14" height="14"/>
                            </svg>
                            Rectangle
                        </button>
                        <button class="tool-btn" data-shape="circle">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="10" cy="10" r="7"/>
                            </svg>
                            Circle
                        </button>
                        <button class="tool-btn" data-shape="triangle">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M10 3 L17 17 L3 17 Z"/>
                            </svg>
                            Triangle
                        </button>
                    </div>
                </div>

                <div class="tool-section">
                    <h3>Actions</h3>
                    <div class="button-group">
                        <button class="action-btn" id="undo-btn" disabled>
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                                <path d="M3 10h12M7 6l-4 4 4 4"/>
                            </svg>
                            Undo
                        </button>
                        <button class="action-btn" id="redo-btn" disabled>
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                                <path d="M17 10H5M13 6l4 4-4 4"/>
                            </svg>
                            Redo
                        </button>
                        <button class="action-btn danger" id="clear-btn">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                                <path d="M6 8v10h8V8H6zm3-6v2h2V2H9zM4 6h12v1H4V6z"/>
                            </svg>
                            Clear Canvas
                        </button>
                    </div>
                </div>

                <div class="tool-section audio-section">
                    <h3>Audio Controls</h3>
                    <div class="audio-info">
                        <p class="audio-description">Sound effects play while drawing!</p>
                    </div>
                    <div class="button-group">
                        <button class="action-btn audio-btn active" id="toggle-sound">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                                <path d="M10 3.5v13l-4-4H3v-5h3l4-4zm4.5 2.5a5 5 0 0 1 0 8M13 8a2.5 2.5 0 0 1 0 4"/>
                            </svg>
                            Sound: <span class="sound-status">On</span>
                        </button>
                        <button class="action-btn audio-btn" id="toggle-music">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                                <path d="M10 3v10.5a3 3 0 1 0 2-2.83V5l5-1.5v7a3 3 0 1 0 2-2.83V2l-9 2.5z"/>
                            </svg>
                            Music: <span class="music-status">Off</span>
                        </button>
                    </div>
                    <div class="tool-group">
                        <label for="volume-slider">Volume: <span id="volume-value">50</span>%</label>
                        <input type="range" id="volume-slider" min="0" max="100" value="50">
                    </div>
                    <div class="audio-visualizer-wrapper">
                        <canvas id="audio-visualizer" width="230" height="60"></canvas>
                    </div>
                </div>
            </aside>

            <section class="canvas-section">
                <div class="canvas-wrapper">
                    <canvas id="drawing-canvas"></canvas>
                </div>
            </section>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Drawing Board Project | Created for Multimedia Project, Author: Ciprian</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
